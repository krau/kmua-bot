          所应用的权限在此群组中不可用, 请使用 /sett 命令修改
          (例如, 管理话题的权限仅在开启了话题的群组中可用哦)
    ip:
      no_ip_provided: "请提供要查询的 IP/域名"
      querying: "正在查询: {ip}"
      query_failed: "查询失败: {error_type}: {error}"
      query_failed_reason: "查询失败: {message}"
      query_target: "查询目标: <code>{url}</code>"
      resolved_address: "解析地址: <code>{query}</code>"
      location: "地区: <code>{country} - {region} - {city}</code>"
      coordinates: "经纬度: <code>{lat},{lon}</code>"
      isp: "ISP: <code>{isp}</code>"
      organization: "组织: <code>{org}</code>"
      as_number: '<a href="https://bgp.he.net/{as_link}">{as_number}</a>'
      mobile_ip: "此 IP 可能为<b>蜂窝移动数据 IP</b>"
      proxy_ip: "此 IP 可能为<b>代理 IP</b>"
      hosting_ip: "此 IP 可能为<b>数据中心 IP</b>"
    help: |
      <blockquote expandable="true">
      /start - 开始使用|打开菜单
      /help - 显示此帮助信息
      /config - 更改 bot 在群组中的设置
      /waifu - 今天的群友老婆!
      /waifu_graph - 老婆关系图!
      /q - 记录语录
      /d - 删除语录|管理群语录
      /qrand - 随机语录
      /qp - 设置随机主动发送语录的概率
      /t - 获取头衔|互赠头衔
      /td - 删除你的头衔
      /sett - 更改 /t 命令所赋予的权限
      /setu - 来点色图 (/ω＼*)
      /greet - 设置群组欢迎语
      /id - 获取聊天ID
      /ip - 查询IP/域名信息
      /wordcloud - 生成聊天记录词云
      /botpromote - 在群组中设置bot管理员 (对于bot该用户将具有同等于群主的权限)
      /botdemote - 在群组中取消bot管理员
      /syncmembers - 同步群组成员
      /f5avatar - 刷新你的头像
      /forget - 让 bot 忘记与你的对话记录
      /throwbottle - 扔一个漂流瓶
      /pickbottle - 捡一个漂流瓶
      </blockquote>
      对其他人使用 "/" 或 "\" 即可对其施法
    help_inline: |
      在任意聊天框中输入 @{me_username} 即可进入 Inline 模式

      Inline 模式下可使用以下参数:

      q [关键词] - 查询语录
      ms - 某游戏相关meme生成
    reply:
      default:
        - 喵喵?
    manyacg:
      artwork_pictures_count: 该作品共有 {count} 张图片
      seefull: ->点击查看
      chat_setu_disabled: 这里不允许涩图哦
      setu_cd: 太快了! 不行!
      setu_error: 失败了喵, 请稍后再试
    greeting:
      usage: |
        使用方法: /greet <动作> [参数]
        可用动作: set, remove, show
        - set <欢迎语>:     
          设置群组欢迎语, 可以使用以下变量:
          ${user} - 新群u用户名
          ${chat} - 群组标题
          可使用 HTML
        - remove:
          移除群组欢迎语
        - 预览:
          显示当前群组欢迎语
      set_usage: |
        使用方法: /greet set <欢迎语>
        可用变量:
        ${user} - 新群u用户名
        ${chat} - 群组标题
        可使用 HTML
      too_long: 太长了! 不行!
      set_success: 群组欢迎语设置好啦
      remove_success: 群组欢迎语已移除
      not_set: 本群还没有设置欢迎语哦
      template_error: 解析欢迎语模板时发生错误, 请不要插入奇怪的东西
    botadmin:
      invalid_user: |
        无效的用户, 请提供有效的用户 ID, 或回复一条消息
        (不能将频道身份, 匿名管理等设置为 bot 管理员, 该命令也不能对自己使用哦)
      user_not_found: 找不到该用户
      user_is_bot: 不能对 Bot 使用此命令哦
      user_not_in_chat: 该用户似乎不在群组里, 让 ta 出来发个言吧~
