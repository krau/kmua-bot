    greeting:
      usage: |
        Usage: /greet <action> [arguments]
        Available actions: set, remove, show
        - set <welcome_message>:
          Sets the group welcome message. You can use these variables:
          ${user} - New member's username
          ${chat} - Group title
          HTML is supported.
        - remove:
          Removes the group welcome message.
        - show:
          Shows the current group welcome message.
      set_usage: |
        Usage: /greet set <welcome_message>
        Available variables:
        ${user} - New member's username
        ${chat} - Group title
        HTML is supported.
