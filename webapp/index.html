<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover plus the safe-area insets from the Telegram SDK is what
      keeps content clear of the notch and the home gesture area.
      user-scalable=no because the panel is a native-feeling settings surface, not
      a document: pinch-zoom inside the Telegram WebView reads as a glitch.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>kmua</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
