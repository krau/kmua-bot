packages:
  - .

# Pin patched releases; minimatch and glob have no fixed release in the
# vulnerable major lines, so they must be overridden to a patched major.
overrides:
  nanoid: 3.3.18
  valibot: 1.4.2
  undici: 7.30.1
  minimatch: 11.0.1
  glob: 14.0.6
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
