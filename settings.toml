agent_prompt = ''''''

# Provider configuration. Each named provider can specify:
#   url     = base URL of the API endpoint
#   key     = API key
#   api_type = "chat_completions" (default, broadly compatible) or "responses" (OpenAI Responses API)
#   proxy   = optional HTTP proxy for this provider (http://, https://, socks5://)
#             e.g. proxy = "http://127.0.0.1:7890" or "socks5://user:pass@127.0.0.1:1080"
#             requires httpx[socks] for socks5 (already pulled via ddgs, or pip install httpx[socks])
#
# Global fallback for all providers without an explicit proxy:
# agent_proxy = "http://127.0.0.1:7890"
#
# Example:
# [agent_providers.default]
# url = "https://api.openai.com/v1"
# key = "sk-..."
# api_type = "chat_completions"
# # proxy = "http://127.0.0.1:7890"
#
# [agent_providers.openai_native]
# url = "https://api.openai.com/v1"
# key = "sk-..."
# api_type = "responses"
manyacg_api_url = "https://api.manyacg.top/v1"
manyacg_api_key = ""
manyacg_channel = "MoreACG"
manyacg_bot = "kirakabot"
manyacg_setu_cd = 1

# Infographic API https://github.com/krau/infographic-api
# infographic = false
