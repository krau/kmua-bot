name: Update Contributors List

on:
  push:
    branches:
      - v2
      - dev
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "settings.toml"
  workflow_dispatch:

jobs:
  update-contributors:
    name: Update Contributors List
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@v2.3.10
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

