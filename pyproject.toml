[project]
name = "kmua-bot"
version = "2.9.0"
description = "A Telegram Bot"
readme = "README.md"
license = "AGPL-3.0"
requires-python = "==3.13.*"
dependencies = [
    "agentfs-sdk>=0.6.4,<0.7",
    "aiocache[redis]>=0.12.3",
    "aiofiles>=24.1.0",
    "aiomcache>=0.8.2",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.1",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "crawl4ai>=0.9.0",
    "ddgs>=9.2.3",
    "dynaconf>=3.2.13",
    "emoji>=2.11",
    "fastapi>=0.121.0",
    "fastmcp>=3.2.0",
    "feedparser>=6.0.11",
    "google-cloud-aiplatform>=1.133.0",
    "graphviz>=0.20.3",
    "httpx>=0.28.1",
    "idna>=3.0",
    "kurigram>=2.2.3",
    "loguru>=0.7.3",
    "openai>=2.16.0",
    "orjson>=3.10.18",
    "pillow>=12.3.0",
    "pilmoji>=2.0.4",
    "powermem>=1.0.0",
    "pyasn1>=0.6.4",
    "pydantic>=2.11.4",
    "pydantic-ai>=2.22.0,<3",
    "pydantic-ai-harness>=0.16.0",
    "pyjwt>=2.13.0",
    "pyopenssl>=26.0.0",
    "pyyaml>=6.0.2",
    "redis>=6.2.0",
    "sketchbook-py==0.2.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "sqlite-vec>=0.1.6",
    "telegramify-markdown>=1.0.0",
    "tgcrypto>=1.2.5",
    "ujson>=5.13.0",
    "uvicorn[standard]>=0.40.0",
    "uvloop>=0.21.0",
    "wordcloud>=1.9.4",
    "zhconv>=1.4.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# aiosqlite and pyrogram log every statement at DEBUG; captured output at that
# level buries the actual assertion in a failure report.
log_level = "WARNING"

[tool.ruff.lint]
select = ["F", "UP", "I"]

[tool.uv.sources]
# pydantic-ai-slim = { git = "https://github.com/krau/pydantic-ai", subdirectory = "pydantic_ai_slim" }
pilmoji = { git = "https://github.com/jay3332/pilmoji.git" }
kurigram = { git = "https://github.com/KurimuzonAkuma/kurigram.git" }

# Security overrides: force upgrade of transitive deps with known CVEs.
# Remove an entry once its parent package allows the patched version on its own.
[tool.uv]
override-dependencies = [
    "aiohttp>=3.14.1",
    "authlib>=1.6.12",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "cryptography>=48.0.1",
    "filelock>=3.20.3",
    "fonttools>=4.60.2",
    "joserfc>=1.6.8",
    "lxml>=6.1.0",
    "mako>=1.3.12",
    "mcp>=1.28.1",
    "nltk>=3.10.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "soupsieve>=2.8.4",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
