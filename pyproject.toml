[project]
name = "kmua-bot"
version = "2.9.0"
description = "A Telegram Bot"
readme = "README.md"
license = "AGPL-3.0"
requires-python = "==3.13.*"
dependencies = [
    "agentfs-sdk>=0.6.2",
    "aiocache[redis]>=0.12.3",
    "aiofiles>=24.1.0",
    "aiomcache>=0.8.2",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.1",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "crawl4ai>=0.8.6",
    "ddgs>=9.2.3",
    "dynaconf>=3.2.13",
    "emoji>=2.11",
    "fastmcp>=2.14.0",
    "google-cloud-aiplatform>=1.133.0",
    "graphviz>=0.20.3",
    "httpx>=0.28.1",
    "idna>=3.0",
    "kurigram>=2.2.3",
    "loguru>=0.7.3",
    "openai>=2.16.0",
    "orjson>=3.10.18",
    "pillow>=11.2.1",
    "pilmoji>=2.0.4",
    "powermem>=1.0.0",
    "pyasn1>=0.6.3",
    "pydantic>=2.11.4",
    "pydantic-ai>=1.7.0",
    "pyjwt>=2.12.0",
    "pyopenssl>=26.0.0",
    "pyyaml>=6.0.2",
    "redis>=6.2.0",
    "sketchbook-py==0.2.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "sqlite-vec>=0.1.6",
    "telegramify-markdown>=1.0.0",
    "tgcrypto>=1.2.5",
    "ujson>=5.12.0",
    "uvloop>=0.21.0",
    "wordcloud>=1.9.4",
    "zhconv>=1.4.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["F", "UP", "I"]

[tool.uv.sources]
# pydantic-ai-slim = { git = "https://github.com/krau/pydantic-ai", subdirectory = "pydantic_ai_slim" }
pilmoji = { git = "https://github.com/jay3332/pilmoji.git" }
kurigram = { git = "https://github.com/KurimuzonAkuma/kurigram.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
